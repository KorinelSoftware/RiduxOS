set timeout_style=hidden
set timeout=0
set default=0

insmod all_video
insmod vbe
insmod vga
insmod gfxterm
insmod gfxmenu

# Keep the software framebuffer deliberately small. Until a real accelerated
# display path lands, VirtualBox MMIO + full-screen software composition at
# 1920x1080 makes the desktop feel frozen before Firefox even starts.
set gfxmode=1024x768x32
set gfxpayload=1024x768x32
terminal_output gfxterm

menuentry "RiduxOS Unix" {
    set root=(cd)
    multiboot2 /boot/ridux-kernel.bin
    module2 /boot/initrd.img ridux-rootfs
    module2 /boot/initrd-overlay.img ridux-overlay
}

if [ -f /boot/sel4/kernel-x86_64-pc99 ]; then
menuentry "Ridux Browser VM (seL4 prototype)" {
    set root=(cd)
    multiboot2 /boot/sel4/kernel-x86_64-pc99
    module2 /boot/sel4/capdl-loader-image-x86_64-pc99 capdl-loader
}
fi
