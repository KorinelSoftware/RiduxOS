set timeout_style=countdown
set timeout=1
set default=0

insmod all_video
insmod vbe
insmod vga
serial --unit=0 --speed=115200

# Keep a moderate widescreen mode for the native Ridux shell. 1280x720 keeps
# Ring 3 compositing responsive while still leaving room for Qt/GTK apps.
set gfxmode=1280x720x32
set gfxpayload=1280x720x32
terminal_input console serial
terminal_output console serial

menuentry "RiduxOS Unix" {
    set root=(cd)
    multiboot2 /boot/ridux-kernel.bin
    module2 /boot/initrd.img ridux-rootfs
    module2 /boot/initrd-overlay.img ridux-rootfs-overlay
}

if [ -f /boot/sel4/kernel-x86_64-pc99 ]; then
menuentry "Ridux Browser VM (seL4 prototype)" {
    set root=(cd)
    multiboot2 /boot/sel4/kernel-x86_64-pc99
    module2 /boot/sel4/capdl-loader-image-x86_64-pc99 capdl-loader
}
fi
