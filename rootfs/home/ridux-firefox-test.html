<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ridux Firefox Render Test</title>
  <style>
    body{margin:40px;font:20px sans-serif;background:#f7fafc;color:#101828}
    .card{max-width:760px;border:1px solid #cbd5e1;border-radius:8px;padding:24px;background:#fff}
    h1{font-size:34px;margin:0 0 14px}
    p{line-height:1.45}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button,input{font:inherit;padding:8px 12px;border:1px solid #94a3b8;border-radius:6px;background:white}
    button{background:#0f766e;color:white;border-color:#0f766e}
  </style>
</head>
<body>
  <main class="card">
    <h1>Ridux Firefox Render Test</h1>
    <p>HTML, CSS, text shaping, layout, input and click handling are alive.</p>
    <div class="row">
      <input value="type here">
      <button onclick="document.body.style.background='#ecfdf5'">Click test</button>
    </div>
  </main>
</body>
</html>
